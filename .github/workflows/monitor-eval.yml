name: Monitor eval (live, billed)

# The live eval of the Monitor agent (scripts/monitor_eval.py) against Claude. It runs only when the owner starts it
# by hand; pull requests and forks never run it. The ANTHROPIC_API_KEY secret may hold either:
# - a Console API key: the eval uses the Messages API (the production path, billed per request), or
# - a Claude subscription token from `claude setup-token` (sk-ant-oat…): the eval goes through Claude Code (`claude -p`).
# The step prints only which kind it found, never the value.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model id
        required: true
        default: claude-sonnet-5-5

permissions:
  contents: read

jobs:
  eval:
    if: github.repository == 'MiladNalbandi/keel-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra anthropic --python 3.12
      - name: run the eval
        env:
          SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          key="$(printf '%s' "$SECRET" | tr -d '[:space:]')"
          echo "::add-mask::$key"
          if [ "$key" != "$SECRET" ]; then echo "note: removed spaces or line breaks around the secret"; fi
          case "$key" in
            sk-ant-oat*)
              echo "credential: Claude subscription token, so the eval runs through Claude Code"
              npm install --global --silent @anthropic-ai/claude-code@2.1.285
              CLAUDE_CODE_OAUTH_TOKEN="$key" uv run --locked python scripts/monitor_eval.py --run --via claude-code \
                --model "$MODEL" --out monitor-eval.json
              ;;
            *)
              echo "credential: API key, so the eval uses the Messages API"
              ANTHROPIC_API_KEY="$key" uv run --locked python scripts/monitor_eval.py --run --via api \
                --model "$MODEL" --out monitor-eval.json
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-eval
          path: monitor-eval.json
          if-no-files-found: warn
