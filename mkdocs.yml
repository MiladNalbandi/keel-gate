      - Protect Claude Code: guides/protect-claude-code.md
      - Protect a Claude API app: guides/protect-claude-api-app.md
      - Protect an OpenAI app: guides/protect-openai-app.md
      - Protect MCP tools: guides/protect-mcp-tools.md
      - Run the Gate Service: guides/run-gate-service.md
      - Write a policy: guides/write-a-policy.md
      - Set a mandate: guides/set-a-mandate.md
      - Approve from your phone: guides/approve-from-phone.md
  - Reference:
