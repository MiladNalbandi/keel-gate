[project]
name = "keel-gate"
version = "0.1.0"
description = "A fast, fail-closed action firewall between AI agents and their tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Milad Nalbandi" }]
keywords = ["ai-safety", "agents", "llm", "tool-calling", "guardrails", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Core stays small: the decision engine is pure Python plus these.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
agent-sdk = ["claude-agent-sdk>=0.1"]
mcp = ["mcp>=1.2"]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
    "pymarkdownlnt>=0.9",
]

[project.scripts]
keel-gate = "keel_gate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel_gate"]

# ---------- quality tools ----------

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # modern syntax
    "S",             # security (bandit rules)
    "BLE",           # no blind `except Exception` that hides errors
    "SIM", "C4",     # simpler code
    "PT",            # pytest style
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["keel_gate", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts and fake secrets are fine in tests
"bench/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["keel_gate"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "redteam: attack scenarios taken from real incidents",
    "slow: longer tests (benchmarks, property tests with many examples)",
]

[tool.coverage.run]
source = ["keel_gate"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
